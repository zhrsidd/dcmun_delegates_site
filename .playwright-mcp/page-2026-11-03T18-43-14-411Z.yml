          - heading "About DCMUN" [level=2] [ref=f1e27]
          - paragraph [ref=f1e28]: Doha College Model United Nations (DCMUN) is hosted at Doha College’s Al Wajba campus. DCMUN XVIII takes place from 5 to 7 November 2026. The Saturday afternoon programme takes place at the Mondrian Hotel.
          - generic [ref=f1e29]:
            - generic [ref=f1e30]: Theme
            - paragraph [ref=f1e31]: Unrest
          - complementary [ref=f1e32]:
            - heading "A message from the President of the General Assembly" [level=3] [ref=f1e33]
            - paragraph [ref=f1e34]: “In a time of uncertainty, you will see unrest. You will see a conflict of opinions, and you will see many dissatisfactions from people directed to institutions. Do not be discouraged by these differences. Raise your voice, ask questions and do not be afraid to confront difficult topics. Through adversity, we hope that you are able to persevere, collaborate and find a path for positive progress during an anxious era. ”
            - paragraph [ref=f1e35]: Yushi Zhang · President of the General Assembly
