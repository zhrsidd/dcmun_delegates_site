              - heading "Shirin Dhankhar" [level=3] [ref=f1e282]
              - paragraph [ref=f1e283]: “Hello! My name is Shirin, and I’ll be your Head of Press for this year’s conference! I am so excited to be working with everyone, creating new content, and making it a wonderful conference. See you there!”
          - 'group "9 of 20: Aryana Udayar" [ref=f1e284]':
            - generic [ref=f1e285]:
              - paragraph [ref=f1e286]: Deputy Head of Press
              - heading "Aryana Udayar" [level=3] [ref=f1e287]
              - paragraph [ref=f1e288]: “Hello! I’m Aryana, one of your Deputy Heads of Press for this year’s conference! I am so excited to make this year’s conference the most memorable one yet!”
          - 'group "10 of 20: Lara Skindhoj" [ref=f1e289]':
            - generic [ref=f1e290]:
              - paragraph [ref=f1e291]: Deputy Head of Press
              - heading "Lara Skindhoj" [level=3] [ref=f1e292]
              - paragraph [ref=f1e293]: “Hi everyone! My name is Lara Skindhøj, and I will be your Deputy Head of Press for DCMUN 2026. I’m so excited to see everyone talk about the important topics issued by DCMUN and to hear everyone’s input. Hope to see you there!”
          - 'group "11 of 20: Anvita Chaitanya" [ref=f1e294]':
            - generic [ref=f1e295]:
              - paragraph [ref=f1e296]: President of the International Court of Justice
              - heading "Anvita Chaitanya" [level=3] [ref=f1e297]
              - paragraph [ref=f1e298]: “Hi, my name's Anvita, and as President of the ICJ, I'm really excited to support and challenge this year's advocates while helping create an engaging and memorable experience for everyone involved. I'm looking forward to making this our best ICJ conference yet!”
          - 'group "12 of 20: Vedika Kumar" [ref=f1e299]':
