              - paragraph [ref=f1e323]: “As Deputy Head of Training, I hope to make training sessions fun and welcoming while helping delegates, whether they are completely new to MUN or already have experience. I'm excited to work with the members this year, support everyone, and help make DCMUN an enjoyable and memorable experience!”
