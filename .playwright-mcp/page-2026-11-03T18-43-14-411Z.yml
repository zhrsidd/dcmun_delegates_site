          - 'group "1 of 20: Adhithi Karthikeyan" [ref=f1e244]':
            - generic [ref=f1e245]:
              - paragraph [ref=f1e246]: Secretary-General
              - heading "Adhithi Karthikeyan" [level=3] [ref=f1e247]
              - paragraph [ref=f1e248]: “Hi, I'm Adhithi, and I'm honoured to serve as SG for DCMUN XVIII! I can't wait to make this conference one of the best yet and welcome everyone to the amazing experience of DCMUN.”
          - 'group "2 of 20: Mary Kurian" [ref=f1e249]':
            - generic [ref=f1e250]:
              - paragraph [ref=f1e251]: Secretary-General
              - heading "Mary Kurian" [level=3] [ref=f1e252]
              - paragraph [ref=f1e253]: “Hello everyone! My name is Mary Kurian, and I'm incredibly excited to be serving as your Secretary-General for this year's MUN. I truly believe that change begins with a voice, and together, we can turn those voices into action. I look forward to working with all of you and making this MUN an unforgettable experience.”
          - 'group "3 of 20: Jianne Lee" [ref=f1e254]':
            - generic [ref=f1e255]:
              - paragraph [ref=f1e256]: Deputy Secretary-General
              - heading "Jianne Lee" [level=3] [ref=f1e257]
              - paragraph [ref=f1e258]: “Hi everyone! I’m Jianne Lee, one of your Deputy Secretaries-General for this year’s conference. I’m incredibly excited to join this year’s MUN team and look forward to fostering engaging debate and creating an unforgettable MUN experience for all of you!”
          - 'group "4 of 20: Anushka Gudavalli" [ref=f1e259]':
            - generic [ref=f1e260]:
              - paragraph [ref=f1e261]: Deputy Secretary-General
              - heading "Anushka Gudavalli" [level=3] [ref=f1e262]
              - paragraph [ref=f1e263]: “Hi, I'm Anushka, and I'll be your DSG this year. I'm excited to work with the exec team to make this year's DCMUN the best yet!”
          - 'group "5 of 20: Yushi Zhang" [ref=f1e264]':
            - generic [ref=f1e265]:
              - paragraph [ref=f1e266]: President of the General Assembly
              - heading "Yushi Zhang" [level=3] [ref=f1e267]
              - paragraph [ref=f1e268]: “Hello, I’m Yushi Zhang. I can’t wait to see everyone at the conference and present our resolution issues to all delegates. I’ll also ensure that every committee session runs smoothly. I look forward to reviewing your applications!”
          - 'group "6 of 20: Akshara Papineni" [ref=f1e269]':
            - generic [ref=f1e270]:
              - paragraph [ref=f1e271]: Deputy President of the General Assembly
              - heading "Akshara Papineni" [level=3] [ref=f1e272]
              - paragraph [ref=f1e273]: “Hi! I’m Akshara, and my job lies in making the committees in this conference as educational and fun as possible! Hope to see you at the conference soon!”
          - 'group "7 of 20: Amna Waqar" [ref=f1e274]':
            - generic [ref=f1e275]:
              - paragraph [ref=f1e276]: Deputy President of the General Assembly
              - heading "Amna Waqar" [level=3] [ref=f1e277]
              - paragraph [ref=f1e278]: “I am honoured to serve as your Deputy President of the General Assembly this year. I look forward to making DCMUN XVIII one of the best conferences yet!”
          - 'group "8 of 20: Shirin Dhankhar" [ref=f1e279]':
