              - heading "Vedika Kumar" [level=3] [ref=f1e302]
              - paragraph [ref=f1e303]: “I'm thrilled to be your Vice President of the ICJ this year! The rest of the ICJ team and I hope to make this year's DCMUN conference unforgettable for you guys!”
